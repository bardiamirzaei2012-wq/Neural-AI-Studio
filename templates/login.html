<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | Neural AI Studio</title>

    <script>
        (function () {
            const theme =
                localStorage.getItem("neural-ai-theme") || "dark";

            document.documentElement.setAttribute(
                "data-theme",
                theme
            );
        })();
    </script>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>

<body class="auth-page">

<div class="auth-wrapper">

    <div class="auth-card">

        <a
            href="{{ url_for('index') }}"
            class="auth-brand"
        >

            <div class="auth-brand-icon">
                <i class="fa-solid fa-brain"></i>
            </div>

            <span>
                Neural AI Studio
            </span>

        </a>


        <h1>
            Welcome 👋
        </h1>

        <p class="auth-description">
            Enter your information to access Neural AI Studio.
        </p>


        <form
            class="auth-form"
            id="loginForm"
        >

            <div class="form-group">

                <label>
                    Email
                </label>

                <div class="input-icon">

                    <i class="fa-solid fa-envelope"></i>

                    <input
                        type="email"
                        class="input-field"
                        placeholder="example@email.com"
                        required
                    >

                </div>

            </div>


            <div class="form-group">

                <label>
                    Password
                </label>

                <div class="password-wrapper">

                    <i class="fa-solid fa-lock"></i>

                    <input
                        type="password"
                        class="input-field"
                        placeholder="Password"
                        required
                    >

                    <button
                        type="button"
                        class="password-toggle"
                    >
                        <i class="fa-solid fa-eye"></i>
                    </button>

                </div>

            </div>


            <div class="auth-options">

                <label class="checkbox-label">

                    <input type="checkbox">

                    <span>
                        Remember me
                    </span>

                </label>

                <a href="#">
                    Forgot password?
                </a>

            </div>


            <button
                type="submit"
                class="btn btn-primary btn-full"
            >

                <i class="fa-solid fa-right-to-bracket"></i>

                Login

            </button>

        </form>


        <div class="auth-divider">
            <span>or</span>
        </div>


        <div class="social-buttons">

            <button
                type="button"
                class="social-btn"
                data-demo-action="google"
            >
                <i class="fa-brands fa-google"></i>
                Google
            </button>

            <button
                type="button"
                class="social-btn"
                data-demo-action="github"
            >
                <i class="fa-brands fa-github"></i>
                GitHub
            </button>

        </div>


        <p class="auth-footer">
            Do not have an account?
            <a href="{{ url_for('register') }}">
                Sign up
            </a>
        </p>

    </div>

</div>


<div
    class="toast-container"
    id="toastContainer"
></div>


<script
    src="{{ url_for('static', filename='js/app.js') }}"
></script>

</body>
</html>
